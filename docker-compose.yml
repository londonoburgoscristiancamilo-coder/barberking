services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: barberia-app
    container_name: barberia_app
    restart: unless-stopped
    environment:
      BARBERKING_BOT_API_KEY: ${BARBERKING_BOT_API_KEY}
      TZ: America/Bogota
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - vendor:/var/www/vendor
      - node_modules:/var/www/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - barberia-network

  webserver:
    image: nginx:alpine
    container_name: barberia_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - barberia-network

  db:
    image: postgres:15-alpine
    container_name: barberia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - barberia-network

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: barberking_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - barberia-network

  evolution-api:
    image: evoapicloud/evolution-api:v1.8.7
    container_name: barberking_evolution
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
    volumes:
      - evolution_store:/evolution/store
      - evolution_instances:/evolution/instances
    networks:
      - barberia-network

volumes:
  pgdata:
  vendor:
  node_modules:
  n8n_data:
  evolution_store:
  evolution_instances:

networks:
  barberia-network:
    driver: bridge
