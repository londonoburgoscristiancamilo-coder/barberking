services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: barberia-app
    container_name: barberia_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www/vendor
    ports:
      - "5173:5173"
    networks:
      - barberia-network

  webserver:
    image: nginx:alpine
    container_name: barberia_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - barberia-network

  db:
    image: postgres:15-alpine
    container_name: barberia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: barberia_db
      POSTGRES_USER: barberia_user
      POSTGRES_PASSWORD: barberia_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - barberia-network

volumes:
  pgdata:

networks:
  barberia-network:
    driver: bridge